<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>secfeed</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #14181f; --muted: #5d6675;
  --line: #dfe3ea; --accent: #0b6bcb; --chip: #eef1f5;
  --crit: #b3141d; --high: #c2500a; --med: #8a6a00; --low: #3b6e2c;
  --kev: #8e1a8e; --ai: #0a6f6a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1116; --panel: #171b22; --ink: #e6e9ee; --muted: #97a1b0;
    --line: #2a303a; --accent: #6cb2ff; --chip: #222832;
    --crit: #ff6b70; --high: #ff9a4d; --med: #e2c14a; --low: #86c873;
    --kev: #e07be0; --ai: #4fd1c9; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1116; --panel: #171b22; --ink: #e6e9ee; --muted: #97a1b0;
  --line: #2a303a; --accent: #6cb2ff; --chip: #222832;
  --crit: #ff6b70; --high: #ff9a4d; --med: #e2c14a; --low: #86c873;
  --kev: #e07be0; --ai: #4fd1c9; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
header {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  border-bottom: 1px solid var(--line); padding-block: 10px 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; z-index: 10;
  height: env(safe-area-inset-top, 0px); background: var(--bg);
}
.wrap { max-width: 860px; margin: 0 auto; }
.top { display: flex; align-items: center; gap: 10px; }
h1 { font-size: 18px; margin: 0; letter-spacing: -0.01em; }
h1 span { color: var(--accent); }
.status { color: var(--muted); font-size: 12px; margin-left: auto; text-align: right; }
button, input, select {
  font: inherit; color: var(--ink); background: var(--panel);
  border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px;
}
button { cursor: pointer; }
button:hover { border-color: var(--accent); }
.filters { display: flex; gap: 8px; margin: 10px 0; flex-wrap: wrap; }
.filters input[type=search] { flex: 1 1 180px; min-width: 0; }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tabs button {
  border: 0; border-bottom: 2px solid transparent; border-radius: 0;
  background: none; color: var(--muted); padding: 8px 12px; white-space: nowrap;
}
.tabs button[aria-selected=true] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.tabs .n { font-size: 11px; color: var(--muted); margin-left: 4px; font-weight: 400; }
main {
  padding-block: 12px 60px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#watchin { flex: 1 1 100%; min-width: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
article {
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  padding: 12px 14px; margin-bottom: 8px; border-left: 3px solid var(--line);
}
article.watch { border-left-color: var(--accent); }
article.kev { border-left-color: var(--kev); }
.meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
article h2 { font-size: 15px; margin: 4px 0; font-weight: 600; overflow-wrap: anywhere; }
article h2 a { color: var(--ink); text-decoration: none; }
article h2 a:hover { color: var(--accent); text-decoration: underline; }
article h2 a:visited { color: var(--muted); }
article p { margin: 0; color: var(--muted); font-size: 13.5px; overflow-wrap: anywhere; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.chips:empty { display: none; }
.chip {
  font-size: 11.5px; padding: 1px 8px; border-radius: 999px; background: var(--chip);
  border: 0; color: var(--ink); font-family: ui-monospace, Menlo, Consolas, monospace;
}
.pill { font-size: 11px; font-weight: 700; padding: 0 7px; border-radius: 4px; border: 1px solid currentColor; }
.pill.crit { color: var(--crit); } .pill.high { color: var(--high); }
.pill.med { color: var(--med); } .pill.low { color: var(--low); }
.pill.kev { color: var(--kev); } .pill.ai { color: var(--ai); }
.pill.tag { color: var(--muted); font-weight: 600; }
.pill.hot { color: var(--crit); }
article.read h2 a { color: var(--muted); }
.star { margin-left: auto; border: 0; background: none; padding: 0 2px; font-size: 17px; line-height: 1; color: var(--muted); }
.star[aria-pressed=true] { color: var(--med); }
.note { color: var(--muted); font-size: 12.5px; margin: 0 0 10px; }
.d-links { display: flex; gap: 6px 14px; flex-wrap: wrap; font-size: 13.5px; }
.d-links a { color: var(--accent); }
footer { color: var(--muted); font-size: 12.5px; margin-top: 18px; }
.empty { text-align: center; color: var(--muted); padding: 40px 0; }
details { margin-top: 24px; color: var(--muted); font-size: 13px; }
details table { width: 100%; border-collapse: collapse; margin-top: 8px; }
details td { padding: 4px 6px; border-top: 1px solid var(--line); vertical-align: top; overflow-wrap: anywhere; }
.ok { color: var(--low); } .error { color: var(--crit); } .skipped { color: var(--med); }
#more { display: block; margin: 12px auto; }
article { cursor: pointer; }
article:hover { border-color: var(--accent); }
dialog {
  width: 100%; max-width: min(720px, calc(100vw - 24px)); max-height: 88vh; max-height: 88dvh;
  padding: 0; border: 1px solid var(--line); border-radius: 12px;
  background: var(--panel); color: var(--ink);
}
dialog::backdrop { background: rgba(0, 0, 0, 0.55); }
.d-bar {
  position: sticky; top: 0; display: flex; gap: 8px; align-items: center;
  padding: 10px 14px; background: var(--panel); border-bottom: 1px solid var(--line);
}
.d-bar .meta { flex: 1; min-width: 0; }
.d-body { padding: 14px 16px 20px; display: flex; flex-direction: column; gap: 16px; }
.d-body h2 { font-size: 18px; margin: 0; line-height: 1.3; overflow-wrap: anywhere; text-wrap: balance; }
.d-body h3 { font-size: 11.5px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
.d-body p, .d-body ul { margin: 0; overflow-wrap: anywhere; }
.d-body ul { padding-left: 18px; display: flex; flex-direction: column; gap: 5px; }
.d-body li b { font-weight: 600; }
.d-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.d-open {
  display: inline-block; background: var(--accent); color: var(--bg); font-weight: 600;
  padding: 8px 14px; border-radius: 8px; text-decoration: none;
}
.d-url { font: 12px ui-monospace, Menlo, Consolas, monospace; color: var(--muted); user-select: all; overflow-wrap: anywhere; }
.d-facts { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 0; font-size: 13.5px; }
.d-facts dt { color: var(--muted); }
.d-facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.d-refs a, .d-related button { color: var(--accent); font-size: 13.5px; }
.d-related button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 4px 0; }
.d-related button:hover { text-decoration: underline; }
.d-related small { color: var(--muted); }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <h1>sec<span>feed</span></h1>
      <div class="status" id="status">loading…</div>
      <button id="refresh" title="Fetch all sources now">Refresh</button>
    </div>
    <div class="filters">
      <input type="search" id="q" placeholder="Search titles, CVE IDs, vendors…">
      <select id="sev" title="Minimum CVSS score (applies to items that have one)">
        <option value="0">Any severity</option>
        <option value="4">Medium+ (4.0)</option>
        <option value="7">High+ (7.0)</option>
        <option value="9">Critical (9.0)</option>
      </select>
      <select id="src"><option value="">All sources</option></select>
      <button id="watchbtn" title="Keywords you care about: matches are highlighted and get their own tab">Watchlist</button>
      <input id="watchin" hidden aria-label="Watchlist keywords" placeholder="Watchlist keywords, comma-separated: fortinet, openssl, …">
    </div>
    <div class="tabs" id="tabs" role="tablist"></div>
  </div>
</header>
<main>
  <div class="wrap">
    <p class="note" id="note" hidden></p>
    <div id="list"></div>
    <button id="more" hidden>Show more</button>
    <details>
      <summary>Sources</summary>
      <table id="sources"></table>
    </details>
    <footer>Exploit code and techniques listed here are for defending and for authorised testing.
      Only test systems you own or have written permission to test.</footer>
  </div>
</main>
<dialog id="detail" aria-label="Item details">
  <div class="d-bar"><div class="meta" id="d-meta"></div><button id="d-close">Close</button></div>
  <div class="d-body" id="d-body"></div>
</dialog>
<script>
"use strict";
// Everything from feeds is inserted with textContent, never innerHTML, so a
// hostile feed entry cannot inject markup or script into this page.

// [id, label, filter, options]. `sort` reorders; `list` swaps the item pool.
const DAY = 86400e3;
const TABS = [
  ["all", "All", () => true],
  ["priority", "Priority", i => i._score > 0 && Date.now() - new Date(i.published) < 14 * DAY,
    { sort: (a, b) => b._score - a._score, max: 100,
      note: "CVEs from the last 14 days, ranked by how likely they are to hurt: seen in real attacks, public exploit code, exploitation probability (EPSS), severity, and your watchlist." }],
  ["cve", "CVEs", i => i.category === "cve"],
  ["exploited", "Exploited", i => i.tags.includes("kev") || i.tags.includes("exploited")],
  ["exploit", "Exploits", i => i.category === "exploit" || i.tags.includes("poc"),
    { note: "Public exploit code and disclosures. Knowing what attackers can already download tells you what to patch and test first." }],
  ["news", "News", i => i.category === "news"],
  ["research", "Research", i => i.category === "research",
    { note: "Write-ups from the teams that find and analyse attacks. This is where new techniques appear before they become common." }],
  ["ai", "AI security", i => i.tags.includes("ai")],
  ["tools", "Tools", i => i.category === "tools"],
  ["learn", "Practice", i => i.category === "learn",
    { note: "Upcoming capture-the-flag competitions and bug bounty write-ups, for legal hands-on practice." }],
  ["social", "Social", i => i.category === "social"],
  ["saved", "Saved", () => true, { list: () => saved }],
  ["watch", "Watchlist", i => i._watch],
];
const PAGE = 60;
const state = { tab: "all", q: "", sev: 0, src: "", shown: PAGE, items: [], sources: [] };
const $ = id => document.getElementById(id);

const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let watch = store.get("secfeed.watch", []);
// Saved items are stored whole, so they outlive the feed's 30-day history.
let saved = store.get("secfeed.saved", []);
let read = new Set(store.get("secfeed.read", []));
const isSaved = i => saved.some(s => s.id === i.id);
function toggleSave(i) {
  if (isSaved(i)) saved = saved.filter(s => s.id !== i.id);
  else {
    const { _text, _watch, _score, _why, _exploit, ...plain } = i;
    saved = [plain, ...saved].slice(0, 300);
  }
  store.set("secfeed.saved", saved);
  markWatch(); render();
}
function starButton(i) {
  const on = isSaved(i), b = el("button", "star", on ? "★" : "☆");
  b.setAttribute("aria-pressed", on);
  b.setAttribute("aria-label", on ? "Remove from saved" : "Save");
  b.title = on ? "Remove from saved" : "Save for later";
  b.onclick = e => { e.stopPropagation(); toggleSave(i); if ($("detail").open) openDetail(i); };
  return b;
}
state.tab = store.get("secfeed.tab", "all");

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function ago(isoDate) {
  const s = (Date.now() - new Date(isoDate)) / 1000;
  if (s < 3600) return Math.max(1, Math.round(s / 60)) + "m ago";
  if (s < 86400) return Math.round(s / 3600) + "h ago";
  return Math.round(s / 86400) + "d ago";
}

function sevClass(s) { return s >= 9 ? "crit" : s >= 7 ? "high" : s >= 4 ? "med" : "low"; }

function markWatch() {
  const words = watch.map(w => w.toLowerCase()).filter(Boolean);
  // Which CVEs have public exploit code somewhere in the feed?
  const exploit = new Set();
  for (const i of state.items)
    if (i.category === "exploit" || i.tags.includes("poc")) for (const c of i.cves) exploit.add(c);
  for (const i of [...state.items, ...saved]) {
    i._text = (i.title + " " + i.summary + " " + i.cves.join(" ") + " " + i.source).toLowerCase();
    i._watch = words.some(w => i._text.includes(w));
    const isExploit = i.category === "exploit" || i.tags.includes("poc");
    i._exploit = !isExploit && i.cves.some(c => exploit.has(c));
    // Priority: why this needs attention first. Only vulnerabilities are ranked.
    const why = [];
    let score = 0;
    if (i.category === "cve" && !isExploit) {
      if (i.tags.includes("kev")) { score += 100; why.push("seen in real attacks (CISA)"); }
      else if (i.tags.includes("exploited")) { score += 45; why.push("reported as exploited"); }
      if (i._exploit) { score += 30; why.push("exploit code is public"); }
      if (i.epss != null) { score += i.epss * 60; if (i.epss >= 0.05) why.push(Math.round(i.epss * 100) + "% exploitation probability"); }
      if (i.severity != null) { score += i.severity * 3; if (i.severity >= 9) why.push("critical severity"); }
      if (i._watch) { score += 25; why.push("matches your watchlist"); }
      if (!why.length) score = 0;  // nothing but a middling score: not a priority
    }
    i._score = score; i._why = why;
  }
}

function filtered(tab) {
  const q = state.q.trim().toLowerCase(), opt = tab[3] || {};
  let rows = (opt.list ? opt.list() : state.items).filter(i =>
    tab[2](i) &&
    (!q || i._text.includes(q)) &&
    (!state.src || i.source === state.src) &&
    // Severity filter only hides items that have a score below the bar;
    // news stories and unscored fresh CVEs are hidden too, since you asked for "at least".
    (!state.sev || (i.severity != null && i.severity >= state.sev)));
  if (opt.sort) rows = [...rows].sort(opt.sort);
  return opt.max ? rows.slice(0, opt.max) : rows;
}

function card(i) {
  const a = el("article", (i._watch ? "watch " : "") + (i.tags.includes("kev") ? "kev " : "") + (read.has(i.id) ? "read" : ""));
  // A tap opens the detail view. Ctrl/Cmd/middle-click on the title still
  // opens the original in a new tab, because the link keeps its real href.
  a.onclick = e => {
    if (e.target.closest("button") || e.metaKey || e.ctrlKey || e.shiftKey) return;
    e.preventDefault();
    openDetail(i);
  };
  const meta = metaRow(i);
  meta.append(starButton(i));
  const h = el("h2");
  const link = el("a", null, i.title);
  if (/^https?:\/\//i.test(i.url)) link.href = i.url;
  link.target = "_blank"; link.rel = "noopener noreferrer";
  h.append(link);
  a.append(meta, h);
  if (i.summary) a.append(el("p", null, i.summary));
  const chips = el("div", "chips");
  for (const c of i.cves.slice(0, 8)) {
    const b = el("button", "chip", c);
    b.title = "Show everything mentioning " + c;
    b.onclick = () => { $("q").value = state.q = c; state.shown = PAGE; setTab("all"); };
    chips.append(b);
  }
  a.append(chips);
  return a;
}

function metaRow(i) {
  const meta = el("div", "meta");
  meta.append(el("span", null, i.source), el("span", null, "·"), el("span", null, ago(i.published)));
  meta.lastChild.title = new Date(i.published).toLocaleString();
  if (i.severity != null) meta.append(el("span", "pill " + sevClass(i.severity), "CVSS " + i.severity.toFixed(1)));
  if (i.tags.includes("kev")) meta.append(el("span", "pill kev", "KNOWN EXPLOITED"));
  else if (i.tags.includes("exploited")) meta.append(el("span", "pill kev", "EXPLOITED"));
  if (i.tags.includes("ai") && i.category !== "ai") meta.append(el("span", "pill ai", "AI"));
  if (i._exploit) meta.append(el("span", "pill hot", "EXPLOIT PUBLIC"));
  if (i.epss != null && i.epss >= 0.05) meta.append(el("span", "pill " + (i.epss >= 0.3 ? "hot" : "tag"), "EPSS " + Math.round(i.epss * 100) + "%"));
  for (const t of ["poc", "paper", "ransomware", "ctf", "breach", "release"]) if (i.tags.includes(t)) meta.append(el("span", "pill tag", t.toUpperCase()));
  return meta;
}

// ---- Plain-language explanation -------------------------------------------
// Built from facts the sources publish (CVSS vector, weakness type, KEV
// status), so it needs no AI service and says nothing the data doesn't.

const CWE = {
  "CWE-20": ["Improper input validation", "The software trusts data it should have checked."],
  "CWE-22": ["Path traversal", "An attacker can reach files outside the folder they should be limited to."],
  "CWE-77": ["Command injection", "An attacker can slip their own commands into ones the software runs."],
  "CWE-78": ["OS command injection", "An attacker can make the server run operating-system commands of their choosing."],
  "CWE-79": ["Cross-site scripting (XSS)", "An attacker can plant script in a page so it runs in other visitors' browsers."],
  "CWE-89": ["SQL injection", "An attacker can rewrite the app's database queries to read or change data."],
  "CWE-94": ["Code injection", "An attacker can get their own code executed by the application."],
  "CWE-119": ["Memory corruption", "The program can be made to read or write memory it shouldn't, often leading to crashes or code execution."],
  "CWE-125": ["Out-of-bounds read", "The program can be made to read memory it shouldn't, leaking data or crashing."],
  "CWE-190": ["Integer overflow", "A number wraps around, which can lead to memory corruption."],
  "CWE-200": ["Information exposure", "The software reveals data to someone who shouldn't see it."],
  "CWE-269": ["Improper privilege management", "A user can end up with more rights than intended."],
  "CWE-287": ["Improper authentication", "The login check can be bypassed or fooled."],
  "CWE-306": ["Missing authentication", "A sensitive function can be used without logging in at all."],
  "CWE-352": ["Cross-site request forgery (CSRF)", "A malicious page can make a logged-in user's browser perform actions for the attacker."],
  "CWE-400": ["Resource exhaustion", "An attacker can use up memory or CPU until the service stops responding."],
  "CWE-416": ["Use after free", "The program uses memory after releasing it, which attackers can turn into code execution."],
  "CWE-434": ["Unrestricted file upload", "An attacker can upload a dangerous file, such as a script the server will run."],
  "CWE-476": ["NULL pointer dereference", "The program can be made to crash."],
  "CWE-502": ["Unsafe deserialization", "Data sent by an attacker is turned into live objects, often leading to code execution."],
  "CWE-601": ["Open redirect", "A trusted link can be made to send users to an attacker's site."],
  "CWE-732": ["Incorrect permissions", "Files or resources are accessible to users who shouldn't have access."],
  "CWE-787": ["Out-of-bounds write", "The program can be made to write past the end of its memory, often leading to code execution."],
  "CWE-798": ["Hard-coded credentials", "A password or key is built into the product, so anyone who learns it can get in."],
  "CWE-862": ["Missing authorization", "The software doesn't check whether the user is allowed to do the action."],
  "CWE-863": ["Incorrect authorization", "The permission check exists but can be bypassed."],
  "CWE-918": ["Server-side request forgery (SSRF)", "An attacker can make the server send requests to internal systems on their behalf."],
  "CWE-1321": ["Prototype pollution", "An attacker can tamper with built-in JavaScript objects and change how the app behaves."],
};

function parseVector(v) {
  const o = {};
  for (const part of (v || "").split("/")) {
    const [k, val] = part.split(":");
    if (k && val && k !== "CVSS") o[k] = val;
  }
  return o;
}

function explain(i) {
  const d = i.details || {}, out = [], todo = [];
  const add = (head, text) => out.push([head, text]);
  if (i.tags.includes("kev")) {
    add("Being used in real attacks.", "It is on the US cybersecurity agency CISA's list of vulnerabilities seen exploited in the wild.");
  } else if (i.tags.includes("exploited")) {
    add("Reported as exploited.", "This item says attackers are already using it, or calls it a zero-day (attacked before a fix existed).");
  }
  if (i._exploit) add("Exploit code is public.", "Working or proof-of-concept attack code for this is listed in your feed (see the related items below), so less-skilled attackers can use it too.");
  if (i.epss != null) add(Math.round(i.epss * 1000) / 10 + "% chance of exploitation in the next 30 days.",
    "That is the EPSS estimate, which predicts real-world attacks from past patterns" + (i.epss_pct != null ? "; it is higher than " + Math.floor(i.epss_pct * 100) + "% of all known CVEs." : "."));
  if (i.tags.includes("ransomware")) add("Used by ransomware groups.", "CISA has linked it to ransomware campaigns.");
  if (i.severity != null) {
    const s = i.severity, n = s.toFixed(1) + " out of 10";
    add(s >= 9 ? "Critical severity (" + n + ")." : s >= 7 ? "High severity (" + n + ")." : s >= 4 ? "Medium severity (" + n + ")." : "Low severity (" + n + ").",
        s >= 9 ? "About as bad as it gets: usually easy to attack and with full impact." :
        s >= 7 ? "Serious: worth fixing soon if you run the affected software." :
        s >= 4 ? "Real, but limited by what an attacker needs or what they can gain." : "Limited impact or hard to use.");
  } else if (i.source === "NVD") {
    add("No severity score yet.", "New CVEs often wait days for a score, so judge this one by its description.");
  }
  const v = parseVector(d.vector);
  const av = { N: ["Reachable over the network.", "An attacker does not need to be near the device; if the system faces the internet, anyone can try."],
               A: ["Needs to be on the same network.", "The attacker must be on the same local network, Wi-Fi or Bluetooth range."],
               L: ["Needs local access.", "The attacker must already be able to run something on the machine, or get a user to open a file."],
               P: ["Needs physical access.", "The attacker must have their hands on the device."] }[v.AV];
  if (av) add(...av);
  const pr = { N: ["No login needed.", "The attacker doesn't need an account."],
               L: ["Needs an ordinary account.", "Any regular user login is enough."],
               H: ["Needs admin rights.", "Only someone who is already an administrator can use it."] }[v.PR] ||
             { N: ["No login needed.", "The attacker doesn't need an account."],
               S: ["Needs a login.", "The attacker must be signed in."], M: ["Needs several logins.", "The attacker must authenticate more than once."] }[v.Au];
  if (pr) add(...pr);
  if (v.UI === "N") add("No victim action needed.", "Nobody has to click a link or open a file for the attack to work.");
  else if (v.UI) add("Needs someone to act.", "A person has to be tricked into something, such as clicking a link or opening a file.");
  if (v.AC === "H") add("Hard to pull off.", "The attack depends on conditions the attacker doesn't control, such as timing or an unusual setup.");
  const hi = k => ["H", "C"].includes(v[k] || v["V" + k]);
  const impact = [hi("C") && "read private data", hi("I") && "change data or settings", hi("A") && "take the system offline"].filter(Boolean);
  if (impact.length) add("If it succeeds:", "the attacker can " + impact.join(", ").replace(/, ([^,]*)$/, " and $1") + ".");
  for (const c of d.cwes || []) if (CWE[c]) add("Type of flaw: " + CWE[c][0] + ".", CWE[c][1]);
  if (i.tags.includes("poc")) add("Exploit code is public.", "A proof-of-concept is on GitHub, which makes attacks easier. Treat code from unknown repos as untrusted: fake PoCs that carry malware are common.");
  if (i.tags.includes("ctf")) add("Capture-the-flag competition.", "A legal place to practise attack skills against targets built for it.");
  if (i.tags.includes("breach")) add("Data breach.", "Accounts from this service were exposed. If you or your users had accounts there, change those passwords and anywhere they were reused.");
  if (i.tags.includes("release")) add("New tool version.", "Read the changes before updating; new detection templates and modules show what attackers can now automate.");
  if (i.tags.includes("paper")) add("Academic paper.", "It describes research, which may not match attacks seen in practice yet.");
  if (i.category === "social") add("Social post.", "Unverified until a vendor or known researcher confirms it.");
  if (i.tags.includes("ai") && !out.length) add("About AI systems.", "It concerns attacks on, or security of, AI models and the tools built on them.");

  if (d.required_action) todo.push(d.required_action + (d.due_date ? " US federal agencies must do this by " + d.due_date + ", which is a sensible deadline for anyone." : ""));
  if (i.category === "cve" && !i.tags.includes("poc")) {
    const what = (d.products || []).length ? d.products.slice(0, 3).join(", ") : "the affected product";
    todo.push("Check whether you run " + what + ". If you do, install the vendor's update or apply its workaround.");
    if (i.tags.includes("kev") || i.tags.includes("exploited")) todo.push("Because it is under attack, also look for signs it was already used against you; the references usually list what to check.");
  }
  return { out, todo };
}

function section(title, node) {
  const s = el("section");
  s.append(el("h3", null, title), node);
  return s;
}

function openDetail(i) {
  const d = i.details || {}, body = $("d-body");
  $("d-meta").replaceWith(Object.assign(metaRow(i), { id: "d-meta" }));
  body.replaceChildren(el("h2", null, i.title));
  if (!read.has(i.id)) {
    read.add(i.id);
    store.set("secfeed.read", [...read].slice(-3000));
    render();
  }

  const actions = el("div", "d-actions");
  const open = el("a", "d-open", "Open original ↗");
  if (/^https?:\/\//i.test(i.url)) open.href = i.url;
  open.target = "_blank"; open.rel = "noopener noreferrer";
  const copy = el("button", null, "Copy link");
  copy.onclick = async () => {
    try { await navigator.clipboard.writeText(i.url); copy.textContent = "Copied"; }
    catch { copy.textContent = "Select the link below to copy"; }
  };
  const save = el("button", null, isSaved(i) ? "★ Saved" : "☆ Save");
  save.onclick = () => { toggleSave(i); openDetail(i); };
  actions.append(open, copy, save);
  body.append(actions, el("div", "d-url", i.url));

  if (i._why && i._why.length) body.append(section("Why it ranks high", el("p", null, i._why.join(" · "))));
  const { out, todo } = explain(i);
  if (out.length) {
    const ul = el("ul");
    for (const [head, text] of out) { const li = el("li"); li.append(el("b", null, head), " " + text); ul.append(li); }
    body.append(section("In plain terms", ul));
  }
  if (todo.length) {
    const ul = el("ul");
    for (const t of todo) ul.append(el("li", null, t));
    body.append(section("What to do", ul));
  }
  const text = d.description || i.summary;
  if (text) body.append(section(d.description ? "Official description" : "Summary", el("p", null, text)));

  const facts = el("dl", "d-facts");
  const fact = (k, val) => { if (val) facts.append(el("dt", null, k), el("dd", null, String(val))); };
  fact("Published", new Date(i.published).toLocaleString());
  fact("Source", i.source);
  fact("CVE", i.cves.join(", "));
  fact("Affects", (d.products || []).join(", "));
  fact("Weakness", (d.cwes || []).map(c => CWE[c] ? c + " (" + CWE[c][0] + ")" : c).join(", "));
  fact("CVSS vector", d.vector);
  fact("Fix deadline", d.due_date);
  fact("Stars", d.stars); fact("Language", d.language);
  fact("Last push", d.last_push && new Date(d.last_push).toLocaleString());
  body.append(section("Facts", facts));

  if ((d.references || []).length) {
    const ul = el("ul", "d-refs");
    for (const u of d.references) {
      if (!/^https?:\/\//i.test(u)) continue;
      const a = el("a", null, u.replace(/^https?:\/\//, "").slice(0, 80));
      a.href = u; a.target = "_blank"; a.rel = "noopener noreferrer";
      const li = el("li"); li.append(a); ul.append(li);
    }
    body.append(section("References", ul));
  }

  if (i.cves.length) {
    // One-tap lookups for the usual next questions: is there an exploit, a
    // scanner template, an analysis?
    const c = i.cves[0], q = encodeURIComponent(c), box = el("div", "d-links");
    for (const [label, url] of [
      ["NVD", "https://nvd.nist.gov/vuln/detail/" + q],
      ["CVE.org", "https://www.cve.org/CVERecord?id=" + q],
      ["Exploit-DB", "https://www.exploit-db.com/search?cve=" + q.replace(/^CVE-/i, "")],
      ["GitHub repos", "https://github.com/search?type=repositories&q=" + q],
      ["Nuclei templates", "https://github.com/projectdiscovery/nuclei-templates/search?q=" + q],
      ["AttackerKB", "https://attackerkb.com/search?q=" + q],
    ]) {
      const a = el("a", null, label);
      a.href = url; a.target = "_blank"; a.rel = "noopener noreferrer";
      box.append(a);
    }
    body.append(section("Look up " + c, box));
  }

  const related = state.items.filter(o => o !== i && o.cves.some(c => i.cves.includes(c))).slice(0, 8);
  if (related.length) {
    const box = el("div", "d-related");
    for (const r of related) {
      const b = el("button");
      b.append(r.title + " ", el("small", null, "· " + r.source));
      b.onclick = () => openDetail(r);
      box.append(b);
    }
    body.append(section("Also in your feed about this", box));
  }
  const dlg = $("detail");
  if (!dlg.open) dlg.showModal();
  dlg.scrollTop = 0;
}

function render() {
  const tabs = $("tabs");
  tabs.replaceChildren();
  for (const t of TABS) {
    const [id, label] = t;
    if (id === "watch" && !watch.length) continue;
    if (id === "saved" && !saved.length) continue;
    const b = el("button", null, label);
    b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", id === state.tab);
    b.append(el("span", "n", String(filtered(t).length)));
    b.onclick = () => setTab(id);
    tabs.append(b);
  }
  const tab = TABS.find(t => t[0] === state.tab) || TABS[0];
  const rows = filtered(tab);
  const list = $("list");
  const note = (tab[3] || {}).note;
  $("note").hidden = !note; $("note").textContent = note || "";
  list.replaceChildren(...rows.slice(0, state.shown).map(card));
  if (!rows.length) {
    list.append(el("div", "empty", state.items.length
      ? "Nothing matches these filters."
      : "No items yet. Press Refresh, or check the Sources panel below for errors."));
  }
  $("more").hidden = rows.length <= state.shown;
}

function setTab(id) {
  state.tab = id; state.shown = PAGE; store.set("secfeed.tab", id);
  render(); window.scrollTo(0, 0);
}

function renderSources() {
  const sel = $("src"), keep = sel.value;
  sel.replaceChildren(new Option("All sources", ""));
  for (const n of [...new Set(state.items.map(i => i.source))].sort()) sel.add(new Option(n, n));
  sel.value = keep;
  const t = $("sources");
  t.replaceChildren();
  for (const s of state.sources) {
    const tr = el("tr");
    tr.append(el("td", null, s.name), el("td", s.state, s.state),
              el("td", null, s.detail || s.count + " items"));
    t.append(tr);
  }
}

async function load() {
  try {
    const r = await fetch("data.json", { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    state.items = d.items; state.sources = d.sources;
    markWatch(); renderSources(); render();
    const bad = d.sources.filter(s => s.state === "error").length;
    $("status").textContent = d.items.length + " items · updated " + ago(d.generated_at) +
      (bad ? " · " + bad + " source" + (bad > 1 ? "s" : "") + " failing" : "");
  } catch (e) {
    $("status").textContent = "could not load data: " + e.message;
  }
}

$("d-close").onclick = () => $("detail").close();
$("detail").onclick = e => { if (e.target === $("detail")) $("detail").close(); };  // tap outside
$("q").oninput = e => { state.q = e.target.value; state.shown = PAGE; render(); };
$("sev").onchange = e => { state.sev = +e.target.value; state.shown = PAGE; render(); };
$("src").onchange = e => { state.src = e.target.value; state.shown = PAGE; render(); };
$("more").onclick = () => { state.shown += PAGE; render(); };
$("watchin").value = watch.join(", ");
$("watchbtn").onclick = () => {
  const w = $("watchin");
  w.hidden = !w.hidden;
  if (!w.hidden) w.focus();
};
$("watchin").oninput = e => {
  watch = e.target.value.split(",").map(s => s.trim()).filter(Boolean);
  store.set("secfeed.watch", watch);
  if (!watch.length && state.tab === "watch") state.tab = "all";
  markWatch(); render();
};
$("refresh").onclick = async () => {
  const b = $("refresh");
  b.disabled = true; b.textContent = "Refreshing…";
  try {
    // Static builds have no /refresh endpoint; then this just reloads data.json.
    const r = await fetch("refresh", { method: "POST", headers: { "X-Secfeed": "1" } });
    if (r.status === 202) await new Promise(res => setTimeout(res, 12000));
  } catch {}
  await load();
  b.disabled = false; b.textContent = "Refresh";
};

load();
setInterval(load, 5 * 60 * 1000);
</script>
</body>
</html>
